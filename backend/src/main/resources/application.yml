spring:
  application:
    name: gograbbit
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gograbbit}
    username: ${DATABASE_USERNAME:gograbbit}
    password: ${DATABASE_PASSWORD:gograbbit}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

github:
  api-base-url: https://api.github.com
  token: ${GITHUB_TOKEN:}
  rate-limit-warn-threshold: 100

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.gograbbit: INFO
